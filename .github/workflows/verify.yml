name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install ffmpeg
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Install Playwright browser
        timeout-minutes: 5
        run: npx --no-install playwright-core install --with-deps chromium

      - name: Generate resume PDF
        timeout-minutes: 5
        run: npm run generate-resume

      - name: Check
        timeout-minutes: 5
        run: npm run check

      - name: Build
        timeout-minutes: 5
        run: npm run build

      - name: Install Python browser test dependency
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/site-test-venv"
          "$RUNNER_TEMP/site-test-venv/bin/python" -m pip install playwright==1.62.0

      - name: Test
        timeout-minutes: 10
        run: SITE_TEST_PYTHON="$RUNNER_TEMP/site-test-venv/bin/python" npm test

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan pushed or proposed commits for secrets
        # Default gitleaks rules. Scans only the commits this push/PR adds;
        # a new branch scans all history.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && ! [[ "${BASE_SHA}" =~ ^0+$ ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="${HEAD_SHA}"
          fi
          echo "gitleaks range: ${range}"
          /tmp/gitleaks git --redact --no-banner --log-opts="${range}" .
