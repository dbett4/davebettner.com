name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install PDF and video utilities
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Install Playwright browser
        timeout-minutes: 5
        run: npx --no-install playwright-core install --with-deps chromium

      - name: Generate resume PDF
        timeout-minutes: 5
        run: npm run generate-resume

      - name: Check
        timeout-minutes: 5
        run: npm run check

      - name: Build
        timeout-minutes: 5
        run: npm run build

      - name: Install Python browser test dependency
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/site-test-venv"
          "$RUNNER_TEMP/site-test-venv/bin/python" -m pip install playwright==1.62.0

      - name: Test
        timeout-minutes: 10
        run: SITE_TEST_PYTHON="$RUNNER_TEMP/site-test-venv/bin/python" npm test
