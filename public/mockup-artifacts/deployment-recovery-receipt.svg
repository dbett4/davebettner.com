<text x="72" y="130" fill="#f2eadf" font-family="Archivo,Arial,sans-serif" font-size="42" font-weight="700">Resume without a duplicate write.</text>
<text x="72" y="164" fill="#b9b2aa" font-family="DM Mono,monospace" font-size="16">Hermes Deployment Lab · release v1.0.0 · release commit 1e68676</text>
