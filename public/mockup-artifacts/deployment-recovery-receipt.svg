<g font-family="DM Mono,monospace" font-size="16">
<text x="84" y="238" fill="#73bfc4">01  SCOPE TOOLS</text><text x="84" y="269" fill="#f2eadf">FastMCP server · mock enterprise API · workflow runner</text><text x="84" y="296" fill="#b9b2aa">Credential-free synthetic stack; cloud IaC is validate-only.</text>
<text x="84" y="354" fill="#8da0ce">02  OPERATOR GATE</text><text x="84" y="385" fill="#f2eadf">First write pauses for a separate operator grant.</text><text x="84" y="412" fill="#b9b2aa">Approval is kept distinct from the agent's tool call.</text>
<text x="84" y="470" fill="#ff810a">03  POST-COMMIT FAULT</text><text x="84" y="501" fill="#f2eadf">Fault injected after commit; workflow resumes with the same idempotency key.</text><text x="84" y="528" fill="#b9b2aa">Public proof describes exactly one remaining side effect.</text>
<text x="84" y="586" fill="#73bfc4">04  PUBLIC CI EVIDENCE</text><text x="84" y="617" fill="#f2eadf">Actions run 31892965924 · 241 credential-free tests</text><text x="84" y="644" fill="#b9b2aa">Attests container restart/replay, native telemetry/trace, and fresh-clone checks.</text>
</g>
