<text x="84" y="238" fill="#73bfc4">01  GUARDED DEFAULT</text><text x="84" y="269" fill="#f2eadf">Three safe tools exposed by default.</text><text x="84" y="296" fill="#b9b2aa">The full 117-tool registry requires explicit unsafe opt-in.</text>
<text x="84" y="354" fill="#8da0ce">02  CONFIRM BEFORE WRITE</text><text x="84" y="385" fill="#f2eadf">Mutation request → confirmation gate → write.</text><text x="84" y="412" fill="#b9b2aa">A local write receipt is not treated as remote verification.</text>
<text x="84" y="470" fill="#ff810a">03  READBACK + RECEIPT</text><text x="84" y="501" fill="#f2eadf">Read the result back; keep the receipt redacted.</text><text x="84" y="528" fill="#b9b2aa">Uncertain formula results remain indeterminate, not guessed.</text>
<text x="84" y="586" fill="#73bfc4">04  CREDENTIAL-FREE PROOF</text><text x="84" y="617" fill="#f2eadf">126 credential-free tests · 117 registered contracts</text><text x="84" y="644" fill="#b9b2aa">Offline end-to-end demo runs without credentials.</text>
