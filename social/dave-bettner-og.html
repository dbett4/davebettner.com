<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>Dave Bettner | Senior Manager, Enterprise Deployments</title>
    <style>
      @font-face {
        font-family: 'Archivo Variable';
        src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2');
        font-display: block;
        font-style: normal;
        font-weight: 100 900;
      }

      @font-face {
        font-family: 'Newsreader Variable';
        src: url('../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-wght-normal.woff2') format('woff2');
        font-display: block;
        font-style: normal;
        font-weight: 200 800;
      }

      @font-face {
        font-family: 'DM Mono';
        src: url('../node_modules/@fontsource/dm-mono/files/dm-mono-latin-400-normal.woff2') format('woff2');
        font-display: block;
        font-style: normal;
        font-weight: 400;
      }

      :root {
        --paper: #F5F2EA;
        --paper-alt: #E9E4D9;
        --ink: #171717;
        --orange: #E85D1A;
        --orange-dark: #A93D12;
        --rule: #C9C3B8;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: 'Archivo Variable', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .social-card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 48px 60px 40px;
        overflow: hidden;
        background: var(--paper);
      }

      .social-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 8px;
        background: var(--orange);
      }

      .masthead, .content, .footer { position: relative; z-index: 1; }

      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 34px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--rule);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 650;
        font-size: 18px;
      }

      .brand-mark {
        display: block;
        width: 12px;
        height: 12px;
        background: var(--orange);
      }

      .role {
        font-family: 'DM Mono', monospace;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--orange-dark);
        font-size: 13px;
      }

      .content {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(360px, 0.9fr);
        gap: 64px;
        align-items: center;
        height: 466px;
      }

      .copy { min-width: 0; }

      .kicker {
        margin: 0 0 20px;
        color: var(--orange-dark);
        font-family: 'DM Mono', monospace;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        font-size: 15px;
      }

      h1 {
        max-width: 680px;
        margin: 0;
        color: var(--ink);
        font-family: 'Newsreader Variable', Georgia, serif;
        font-size: 96px;
        font-weight: 480;
        line-height: 1.02;
        letter-spacing: -0.01em;
      }

      .support {
        max-width: 540px;
        margin: 28px 0 0;
        color: var(--ink);
        font-size: 26px;
        font-weight: 500;
        line-height: 1.28;
      }

      .detail-panel {
        position: relative;
        padding: 26px 28px 10px;
        border: 1px solid var(--ink);
        background: var(--paper-alt);
      }

      .detail-panel::before {
        content: '';
        position: absolute;
        top: -1px;
        left: -1px;
        width: 88px;
        height: 5px;
        background: var(--orange);
      }

      .detail-eyebrow {
        margin: 0 0 18px;
        color: var(--orange-dark);
        font: 14px/1.2 'DM Mono', monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .detail-row {
        padding: 14px 0 15px;
        border-top: 1px solid var(--rule);
      }

      .detail-label {
        display: block;
        margin-bottom: 7px;
        color: var(--orange-dark);
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .detail-value {
        display: block;
        color: var(--ink);
        font-size: 23px;
        font-weight: 560;
        line-height: 1.14;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 58px;
        border-top: 1px solid var(--rule);
        color: var(--ink);
        font-size: 13px;
      }

      .footer strong { font-weight: 650; }
      .footer-accent { display: inline-flex; align-items: center; gap: 8px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; color: var(--orange-dark); }
      .footer-accent::before { content: ''; width: 24px; height: 4px; background: var(--orange); }
    </style>
  </head>
  <body>
    <main class="social-card" aria-label="Dave Bettner, Senior Manager, enterprise deployments social card">
      <header class="masthead">
        <span class="brand"><span class="brand-mark" aria-hidden="true"></span>Dave Bettner</span>
        <div class="role">Enterprise deployments</div>
      </header>

      <section class="content">
        <div class="copy">
          <p class="kicker">Senior Manager</p>
          <h1><span>Dave</span> <span>Bettner</span></h1>
          <p class="support">Customer-facing engineering</p>
        </div>

        <aside class="detail-panel" aria-label="Profile details">
          <p class="detail-eyebrow">At a glance</p>
          <div class="detail-row">
            <span class="detail-label">Enterprise experience</span>
            <strong class="detail-value">10+ years implementation</strong>
          </div>
          <div class="detail-row">
            <span class="detail-label">Public work</span>
            <strong class="detail-value">Agent systems + MCP</strong>
          </div>
        </aside>
      </section>

      <footer class="footer">
        <span>Des Moines, Iowa</span>
        <strong class="footer-accent">The Working Record</strong>
      </footer>
    </main>
  </body>
</html>
