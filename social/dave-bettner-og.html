<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>Dave Bettner | Forward-Deployed Engineering · Agent Systems</title>
    <style>
      @font-face {
        font-family: 'Archivo Variable';
        src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2');
        font-display: block;
        font-style: normal;
        font-weight: 100 900;
      }

      @font-face {
        font-family: 'DM Mono';
        src: url('../node_modules/@fontsource/dm-mono/files/dm-mono-latin-400-normal.woff2') format('woff2');
        font-display: block;
        font-style: normal;
        font-weight: 400;
      }

      :root {
        --space: #08090b;
        --space-2: #101114;
        --warm: #f2eadf;
        --ember: #ff5005;
        --rose: #dbba95;
        --lavender: #d0bce1;
        --teal: #73bfc4;
        --graphite: #34353a;
        --muted: #b9b2aa;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--space);
        color: var(--warm);
        font-family: 'Archivo Variable', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.045;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
      }

      .social-card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 38px 54px 30px;
        overflow: hidden;
        background:
          linear-gradient(90deg, var(--space) 0 63%, var(--space-2) 63% 100%),
          var(--space);
      }

      .social-card::before {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        width: 420px;
        height: 10px;
        background: linear-gradient(90deg, var(--ember) 0 42%, var(--teal) 42% 71%, var(--lavender) 71% 100%);
      }

      .masthead, .content, .footer { position: relative; z-index: 1; }

      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 34px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--graphite);
      }

      .brand-mark {
        display: block;
        width: 12px;
        height: 12px;
        background: var(--ember);
        box-shadow: 5px -3px 0 var(--teal);
      }

      .role, .kicker, .detail-label, .footer {
        font-family: 'DM Mono', monospace;
        text-transform: uppercase;
        letter-spacing: 0.09em;
      }

      .role { color: var(--teal); font-size: 13px; }

      .content {
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(390px, 0.92fr);
        gap: 64px;
        align-items: center;
        height: 468px;
      }

      .copy { min-width: 0; }
      .kicker { margin: 0 0 18px; color: var(--teal); font-size: 15px; }

      h1 {
        max-width: 680px;
        margin: 0;
        color: var(--warm);
        font-family: 'Archivo Variable', Arial, sans-serif;
        font-size: 126px;
        font-variation-settings: 'wdth' 75, 'wght' 700;
        line-height: 0.73;
        letter-spacing: -0.065em;
        text-transform: uppercase;
      }

      h1 span { display: block; }
      h1 span:last-child { color: var(--ember); }

      .support {
        max-width: 520px;
        margin: 28px 0 0;
        color: var(--warm);
        font-size: 27px;
        font-weight: 560;
        line-height: 1.08;
      }

      .detail-panel {
        position: relative;
        padding: 24px 26px 8px;
        border: 1px solid var(--graphite);
        border-top: 3px solid var(--teal);
        background: var(--space-2);
        transform: translateY(12px);
      }

      .detail-panel::before {
        content: '';
        position: absolute;
        top: -3px;
        left: 24px;
        width: 88px;
        height: 5px;
        background: var(--ember);
      }

      .detail-eyebrow {
        margin: 0 0 18px;
        color: var(--ember);
        font: 14px/1.2 'DM Mono', monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .detail-row {
        padding: 14px 20px 15px 0;
        border-top: 1px solid var(--graphite);
      }

      .detail-label {
        display: block;
        margin-bottom: 7px;
        color: var(--teal);
        font-size: 11px;
      }

      .detail-value {
        display: block;
        color: var(--warm);
        font-size: 23px;
        font-weight: 560;
        line-height: 1.08;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 58px;
        border-top: 1px solid var(--graphite);
        color: var(--muted);
        font-size: 11px;
      }

      .footer strong { color: var(--warm); font-weight: 400; }
      .footer-accent { display: inline-flex; align-items: center; gap: 8px; }
      .footer-accent::before { content: ''; width: 32px; height: 4px; background: linear-gradient(90deg, var(--ember) 0 50%, var(--teal) 50% 100%); }
    </style>
  </head>
  <body>
    <main class="social-card" aria-label="Dave Bettner forward-deployed engineering and agent systems social card">
      <header class="masthead">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="role">Agent systems</div>
      </header>

      <section class="content">
        <div class="copy">
          <p class="kicker">Forward-deployed engineering</p>
          <h1><span>Dave</span><span>Bettner</span></h1>
          <p class="support">Customer-facing engineering</p>
        </div>

        <aside class="detail-panel" aria-label="Profile details">
          <p class="detail-eyebrow">At a glance</p>
          <div class="detail-row">
            <span class="detail-label">Enterprise experience</span>
            <strong class="detail-value">10+ years implementation</strong>
          </div>
          <div class="detail-row">
            <span class="detail-label">Public work</span>
            <strong class="detail-value">Agent systems + MCP</strong>
          </div>
        </aside>
      </section>

      <footer class="footer">
        <span>Des Moines, Iowa</span>
        <strong class="footer-accent">Engineering · Delivery · Proof</strong>
      </footer>
    </main>
  </body>
</html>
